services:
  api:
    build: .
    restart: unless-stopped
    env_file: /etc/vitruvius/runtime.env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["/opt/vitruvius/repositories:/repositories:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 45s
    depends_on: [redis]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    build:
      context: .
      args: {DOCUMENTS: "1"}
    restart: unless-stopped
    command: ["celery","-A","app.worker.celery","worker","--loglevel=WARNING","--concurrency=1"]
    environment:
      DOCUMENT_PROCESSOR: docling
      HF_HOME: /tmp/huggingface
      OMP_NUM_THREADS: "2"
    volumes: ["document-models:/tmp/huggingface"]
    env_file: /etc/vitruvius/runtime.env
    depends_on: [redis]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  scheduler:
    build: .
    restart: unless-stopped
    command: ["celery","-A","app.worker.celery","beat","--loglevel=WARNING","--schedule=/tmp/celerybeat"]
    env_file: /etc/vitruvius/runtime.env
    depends_on: [redis]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    command: ["redis-server","--save","60","1","--appendonly","yes"]
    volumes: ["redis-data:/data"]
volumes:
  redis-data:
  document-models:
