[project]
name = "vitruvius"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "httpx>=0.28,<1", "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4", "langsmith>=0.4,<1", "openai>=2,<3", "boto3>=1.40,<2", "celery[redis]>=5.5,<6", "mcp>=1.20,<2", "pypdf>=6,<7", "python-multipart>=0.0.20,<1"]
[project.optional-dependencies]
documents = ["docling>=2,<3", "torch>=2.5,<3", "torchvision>=0.20,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
